name: Rollback

# Manually roll the EC2 container back to any image tag already in ECR.
# Actions -> Rollback -> Run workflow -> paste the commit SHA you want.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to roll back to (a commit SHA, or 'latest')"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Confirm the tag exists in ECR
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ inputs.image_tag }}
        run: |
          aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$TAG" \
            --query "imageDetails[0].imagePushedAt" --output text

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Roll the container back
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ inputs.image_tag }}
          INSTANCE_TAG: ${{ vars.EC2_NAME_TAG }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPOSITORY:$TAG"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "rollback to ${TAG:0:7}" \
            --targets "Key=tag:Name,Values=$INSTANCE_TAG" \
            --parameters "commands=[
              'set -euo pipefail',
              'aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY',
              'docker pull $IMAGE',
              'docker rm -f churn-api 2>/dev/null || true',
              'docker run -d --name churn-api --restart unless-stopped -p 80:8000 --memory 700m $IMAGE',
              'for i in \$(seq 1 20); do sleep 3; curl -fsS http://localhost/health && exit 0; done; echo health check failed; exit 1'
            ]" \
            --query "Command.CommandId" --output text)

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "Rollback status: $STATUS"
          test "$STATUS" = "Success"
