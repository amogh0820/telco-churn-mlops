name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Lint, train and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Build the dataset
        run: |
          python -m src.data.download
          python -m src.data.preprocess

      - name: Train a model for the API tests
        run: python -m src.models.train --no-mlflow --quick

      - name: Test
        run: pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Test the frontend
        run: node demo/app.test.js

  deploy:
    name: Build, push to ECR and roll EC2 (optional -- AWS demonstration path)
    # This job exists to demonstrate the AWS deployment workflow from the
    # original tutorial; it is NOT this project's actual deployment target
    # (that's Render -- see render.yaml and README "Deploying"). It runs only
    # if AWS_ROLE_ARN is configured, and skips cleanly rather than failing if
    # it isn't, so a fork or a Render-only setup never gets a red CI run for
    # infrastructure it was never asked to configure.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # OIDC; no long-lived AWS keys stored in GitHub
      contents: read
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the AWS path is configured
        id: gate
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "AWS_ROLE_ARN secret not set; skipping the AWS demonstration deploy. This project's actual deployment is Render -- see README." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip == 'false'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        if: steps.gate.outputs.skip == 'false'
        run: pip install -r requirements-dev.txt

      - name: Train the production model
        # Deliberately the full sweep, not --quick. The model that ships must
        # not be the three-candidate version the test job trains.
        if: steps.gate.outputs.skip == 'false'
        run: |
          python -m src.data.download
          python -m src.data.preprocess
          python -m src.models.train --no-mlflow

      - name: Publish training report
        if: steps.gate.outputs.skip == 'false'
        run: |
          {
            echo '### Model trained for this deploy'
            echo '```json'
            cat reports/test_report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the model artifact
        if: steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: |
            artifacts/
            reports/
          retention-days: 30

      - name: Configure AWS credentials
        if: steps.gate.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ensure the ECR repository exists
        if: steps.gate.outputs.skip == 'false'
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          aws ecr describe-repositories --repository-names "$REPOSITORY" \
            || aws ecr create-repository \
                 --repository-name "$REPOSITORY" \
                 --image-scanning-configuration scanOnPush=true

      - name: Log in to Amazon ECR
        if: steps.gate.outputs.skip == 'false'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push
        if: steps.gate.outputs.skip == 'false'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$REGISTRY/$REPOSITORY:$TAG" \
            --tag "$REGISTRY/$REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Roll the container on EC2 via SSM
        # Plain AWS CLI rather than a third-party action: there is no official
        # aws-actions SSM action, and this needs no extra trust in a marketplace
        # publisher. Deploys the immutable SHA tag, never :latest, so the
        # instance runs exactly the image this commit built.
        if: steps.gate.outputs.skip == 'false'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
          INSTANCE_TAG: ${{ vars.EC2_NAME_TAG }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPOSITORY:$TAG"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${TAG:0:7}" \
            --targets "Key=tag:Name,Values=$INSTANCE_TAG" \
            --parameters "commands=[
              'set -euo pipefail',
              'aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY',
              'docker pull $IMAGE',
              'docker rm -f churn-api 2>/dev/null || true',
              'docker run -d --name churn-api --restart unless-stopped -p 80:8000 --memory 700m $IMAGE',
              'for i in \$(seq 1 20); do sleep 3; curl -fsS http://localhost/health && exit 0; done; echo health check failed; docker logs --tail 50 churn-api; exit 1',
              'docker image prune -af --filter until=168h'
            ]" \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          # `wait` polls for up to ~10 minutes and exits non-zero on failure.
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)

          echo "--- remote stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "--- remote stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text

          echo "Deploy status: $STATUS"
          test "$STATUS" = "Success"

      - name: Verify the public endpoint
        if: steps.gate.outputs.skip == 'false'
        env:
          BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "${BASE_URL:-}" ]; then
            echo "API_BASE_URL variable not set; skipping public smoke test."
            exit 0
          fi
          ./scripts/smoke_test.sh "$BASE_URL"
